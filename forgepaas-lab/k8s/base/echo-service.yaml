apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-service
  labels:
    app.kubernetes.io/name: echo-service
    app.kubernetes.io/part-of: forgepaas
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: echo-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echo-service
    spec:
      containers:
        - name: echo-service
          image: forgepaas/echo-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_VERSION
              value: local-kind
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 4
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: echo-service
  labels:
    app.kubernetes.io/name: echo-service
spec:
  selector:
    app.kubernetes.io/name: echo-service
  ports:
    - name: http
      port: 8080
      targetPort: http
