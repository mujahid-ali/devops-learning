# Lab 06. Apply the ConfigMap/Secret first, then patch the Deployment deliberately as instructed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  namespace: playground
data:
  index.html: |
    <!doctype html>
    <html><body><h1>Hello from a ConfigMap</h1></body></html>
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-secret
  namespace: playground
type: Opaque
stringData:
  # This is fake training data. Never commit a real secret.
  training-token: not-a-real-secret
