# Read this before using it in Lab 01. kind turns each entry below into a Docker container node.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # Keep the default CNI so Lab 02 can show where kindnet is running.
  disableDefaultCNI: false
nodes:
  - role: control-plane
  - role: worker
    # Lab 05 maps localhost:8080 to this node's NodePort 30080.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
  - role: worker
